# Deliberately standalone: do not run the host desktop's startup commands.
# Ubuntu 24.04's old Xwayland is not part of this native-Wayland preview.
xwayland disable
output * mode 1280x800
output * bg #182238 solid_color
font pango:monospace 11
default_floating_border pixel 2
floating_corner_radius 20
client.focused #789bb5 #151820 #e6edf3 #789bb5 #789bb5
client.unfocused #526779 #151820 #e6edf3 #526779 #526779
for_window [app_id="com.mitchellh.ghostty"] floating enable, border pixel 2, resize set width 1000 px height 640 px, move position center
bindsym F2 exec ghostty --gtk-single-instance=false
bindsym F3 fullscreen toggle
bindsym F4 floating toggle
bindsym F5 floating_corner_radius 0
bindsym F6 floating_corner_radius 20
bindsym F12 exit
floating_modifier Mod1
