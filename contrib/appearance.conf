# Live appearance presets; no reload or startup commands are run.
# Alt+Ctrl+0: square; 1: subtle; 2: default; 3: pronounced.
bindsym Mod1+Ctrl+0 floating_corner_radius 0; tiled_corner_radius 0
bindsym Mod1+Ctrl+1 floating_corner_radius 10; tiled_corner_radius 10
bindsym Mod1+Ctrl+2 floating_corner_radius 20; tiled_corner_radius 20
bindsym Mod1+Ctrl+3 floating_corner_radius 30; tiled_corner_radius 30

# Space around and between tiled windows on the current workspace.
# Inner gaps already contribute to the screen-edge gap; outer adds extra.
bindsym Mod1+Ctrl+4 gaps outer current set 0; gaps inner current set 0
bindsym Mod1+Ctrl+5 gaps outer current set 0; gaps inner current set 8
bindsym Mod1+Ctrl+6 gaps outer current set 0; gaps inner current set 16
bindsym Mod1+Ctrl+7 gaps outer current set 0; gaps inner current set 24
