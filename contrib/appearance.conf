# Live presets change rendering only; no reload or startup commands are run.
# Alt+Ctrl+0: square; 1: subtle; 2: default; 3: pronounced.
bindsym Mod1+Ctrl+0 floating_corner_radius 0; tiled_corner_radius 0
bindsym Mod1+Ctrl+1 floating_corner_radius 10; tiled_corner_radius 10
bindsym Mod1+Ctrl+2 floating_corner_radius 20; tiled_corner_radius 20
bindsym Mod1+Ctrl+3 floating_corner_radius 30; tiled_corner_radius 30
